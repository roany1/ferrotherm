[package]
name = "ferrotherm-io"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
rust-version.workspace = true
description = "FerroTherm import/export: STEP (MCAD), IDF, IPC-2581, ODB++, KiCad, Gerber/Excellon, power lists; STEP/IDF/CSV export"
keywords.workspace = true
categories.workspace = true

[dependencies]
ferrotherm-core = { path = "../ferrotherm-core" }
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
quick-xml = "0.42"
zip = { version = "2", default-features = false, features = ["deflate"] }
flate2 = "1"
tar = "0.4"
occt-wasm = { version = "5", optional = true }

[features]
default = ["occt"]
# OpenCascade (WASM) for robust STEP B-rep tessellation
occt = ["dep:occt-wasm"]
