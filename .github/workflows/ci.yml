name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    steps:
      - uses: actions/checkout@v4
      # pinned: newer releases add clippy lints, and CI runs clippy with -D warnings
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.97.0"
          components: clippy, rustfmt
      - name: Format
        run: cargo fmt --all -- --check
      - name: Clippy
        shell: bash
        env:
          CARGO_TERM_COLOR: never
        run: |
          set +e
          cargo clippy --all-targets --release -- -D warnings 2>&1 | tee clippy.log
          status=${PIPESTATUS[0]}
          if [ "$status" != "0" ]; then
            # surface the first errors as an annotation (readable without the log)
            n=0
            grep -E -A10 "^(error|warning)(\[|:)" clippy.log | grep -v "^ *Compiling\|^ *Checking" | tr -d '\r' | head -120 > clippy_err.txt || true
            [ -s clippy_err.txt ] || tail -n 40 clippy.log | tr -d '\r' > clippy_err.txt
            while IFS= read -r line; do
              n=$((n+1)); [ $n -gt 9 ] && break
              echo "::error title=clippy $n::$line"
            done < <(awk 'NR%12==1{if(b)print b; b=$0; next}{b=b" ¦ "$0}END{print b}' clippy_err.txt)
          fi
          exit $status
      - name: Tests (incl. analytical validation)
        run: cargo test --release --all
      - name: Example case
        shell: bash
        run: |
          cargo run --release -p ferrotherm-cli -- run examples/mil_enclosure.toml -o example_results -q || code=$?
          # exit code 2 = a component exceeded its Tj limit (expected in this example)
          test "${code:-0}" = "0" -o "${code:-0}" = "2"
          test -f example_results/report.md
          test -f example_results/components.csv
          cargo run --release -p ferrotherm-cli -- check examples/forced_air_chassis.toml
          cargo run --release -p ferrotherm-cli -- export examples/mil_enclosure.toml example_results/enclosure.step
          cargo run --release -p ferrotherm-cli -- cad-info example_results/enclosure.step
